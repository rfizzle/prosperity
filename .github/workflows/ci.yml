# Thin stub — logic lives in rfizzle/concord (mod-ci.yml).
# Covers what ci.yml + test.yml used to: build, unit tests, gametests, coverage report artifacts.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual runs; concord's `make promote` dispatches this on the canary member.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  ci:
    uses: rfizzle/concord/.github/workflows/mod-ci.yml@stable
    secrets: inherit
